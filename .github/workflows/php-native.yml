name: Native PHP implementation

on:
  pull_request:
    paths:
      - 'implementations/php-native/**'
      - '.github/workflows/php-native.yml'
  push:
    branches: [main]
    paths:
      - 'implementations/php-native/**'
      - '.github/workflows/php-native.yml'

permissions:
  contents: read

jobs:
  native-php:
    name: PHP ${{ matrix.php }} foundation tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native PHP files
        run: find implementations/php-native -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run native PHP tests
        run: php implementations/php-native/bin/test.php
