name: Native PHP implementation

on:
  pull_request:
    paths:
      - 'implementations/php-native/**'
      - '.github/workflows/php-native.yml'
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'implementations/php-native/**'
      - '.github/workflows/php-native.yml'

permissions:
  contents: read

jobs:
  native-php:
    name: PHP ${{ matrix.php }} native application tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native PHP files
        run: find implementations/php-native -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run native PHP tests
        run: php implementations/php-native/bin/test.php

  mysql-integration:
    name: MySQL migrations and integration smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: talyvane_native_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,fileinfo,zip,gd
          ini-values: upload_max_filesize=12M,post_max_size=16M,memory_limit=256M
          coverage: none
      - name: Run MySQL migration integration smoke
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
        run: php implementations/php-native/bin/integration.php
