name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Audit resolved dependencies
        run: composer audit --no-interaction
        env:
          COMPOSER_NO_AUDIT: "0"
      - name: Preserve resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lockfile
          path: composer.lock
          if-no-files-found: error
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Run feature tests
        run: vendor/bin/phpunit
