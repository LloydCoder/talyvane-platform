name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-recovery-v14-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-version }} / Laravel feature suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, mbstring, openssl, pcre, pdo, pdo_mysql, pdo_sqlite, session, tokenizer, xml
          coverage: none
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Audit resolved dependencies
        run: composer audit --no-interaction
        env:
          COMPOSER_NO_AUDIT: "0"
      - name: Preserve resolved dependency lockfile
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: composer-lockfile
          path: composer.lock
          if-no-files-found: error
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Lint PHP source
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate routes and compile Blade views
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan route:list --except-vendor
          php artisan view:cache
      - name: Run feature tests
        run: vendor/bin/phpunit
